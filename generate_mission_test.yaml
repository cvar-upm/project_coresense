# generate_mission.yaml.example
# Copy and edit this file, then run:
#   python3 generate_mission.py my_spec.yaml
#   python3 generate_mission.py my_spec.yaml --dry-run   # preview without writing

name: test_exp

arena:
  half: 10.0          # arena spans [-half, half] on both axes (metres)

drones:
  count: 5
  start:
    strategy: left_edge   # 'left_edge' — evenly spaced along y at a fixed x
    x: -10.0
    # strategy: custom
    # positions:
    #   - {x: -10.0, y:  6.0}
    #   - {x: -10.0, y:  0.0}

areas:
  # ---- grid_areas: divide arena into rows×cols equal rectangles ----
  layout: grid_areas
  rows: 4
  cols: 4
  prefix: area          # area_A1, area_A2, area_B1, ...

  # ---- strip_areas: N equal parallel strips ----
  # layout: strip_areas
  # count: 5
  # axis: y             # 'y' = horizontal strips, 'x' = vertical strips
  # prefix: strip

  # ---- custom: explicit polygon vertices ----
  # layout: custom
  # polygons:
  #   - name: north_field
  #     vertices:
  #       - {x: -10, y:  0}
  #       - {x:  10, y:  0}
  #       - {x:  10, y: 10}
  #       - {x: -10, y: 10}
  #   - name: south_field
  #     vertices:
  #       - {x: -10, y: -10}
  #       - {x:  10, y: -10}
  #       - {x:  10, y:   0}
  #       - {x: -10, y:   0}

mission:
  takeoff_height: 5.0
  takeoff_speed:  0.7

output:
  world_dir:   config/
  mission_dir: missions_json/
  
# ---- optional: parametric sweep ----
# sweep:
#   - param: drones.count
#     values: [3, 5, 7]
#   - param: areas.rows
#     values: [2, 3, 4]
