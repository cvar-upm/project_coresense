status: request
id: New Mission
use_cartesian_coordinates: true
takeoff_height: 5.0
max_wp_distance: 10.0
uavList: [drone0, drone1]
# failure_injection:
#   drone0:
#     at_waypoint: 3
layers:

  - name: Area
    uavList: [auto]
    height: 5.0
    speed: 2.0
    algorithm: back_and_force
    streetSpacing: 1.0
    wpSpace: 1
    orientation: 0.0
    filterCollinear: false
    values:
      - [-3.0, -3.0]
      - [ 3.0, -3.0]
      - [ 3.0,  3.0]
      - [-3.0,  3.0]

  - name: LandPoint
    uavList: [drone0]
    height: 0.0
    speed: 1.0
    values: [0.0, 0.0]

  - name: LandPoint
    uavList: [drone1]
    height: 0.0
    speed: 1.0
    values: [0.0, 0.0]
