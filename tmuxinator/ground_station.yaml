<%
# Input parameters
drone_namespace = @settings["drone_namespace"]
keyboard_teleop = @settings["keyboard_teleop"] == "true"
rviz            = @settings["rviz"] == "true"
rosbag          = @settings["rosbag"] == "true"
rviz_config     = @settings["rviz_config"] || "config_ground_station/rviz2_config.rviz"
%>

name: ground_station
attach: false
root: ./
windows:

  # Mission monitoring
  - mission_monitoring:
      layout:
      panes:
    <%- drone_namespace.split(',').each do |drone| %>
        - ros2 run as2_alphanumeric_viewer as2_alphanumeric_viewer_node
            --ros-args -r  __ns:=/<%= drone %>
    <%- end %>


  # Ground station
  - ground_station:
      layout:
      panes:
      <%- if keyboard_teleop %>
        - ros2 launch as2_keyboard_teleoperation as2_keyboard_teleoperation_launch.py
            namespace:=<%= drone_namespace %>
      <%- end %>
      <%- if rviz %>
        - ros2 launch as2_visualization swarm_viz.launch.py
            namespace_list:=<%= drone_namespace %>
            rviz_config:=<%= rviz_config %>
            drone_model:=quadrotor_base
      <%- end %>
      <%- if rosbag %>
        - ./rosbag/record_rosbag.bash <%= drone_namespace %>
      <%- end %>
  - mission:
      layout:
      panes:
          - ros2 run knowledge_core kb_tui
          - echo "Run the mission here"

  # Camera AR overlay (fake camera + marker overlay per drone)
  - camera_overlay:
      layout: tiled
      panes:
    <%- drone_namespace.split(',').each do |drone| %>
        - python3 utils/fake_camera_pub.py --namespace <%= drone %>
        - ros2 launch ./launch/camera_overlay.launch.py namespace:=<%= drone %>
    <%- end %>
