<%
# Input parameters
drone_namespace           = @settings["drone_namespace"]
simulation_config_file    = @settings["simulation_config_file"]
motion_controller_plugin  = @settings["motion_controller_plugin"]
base_launch               = @settings["base_launch"] == "true"
%>
name: <%= drone_namespace %>
attach: false
root: ./
startup_window: mission_monitoring
windows:
  # Platform
  - platform:
      layout: tiled
      panes:
      # Platform
      <%- if base_launch %>
      - ros2 launch as2_platform_crazyswarm crazyswarm_server.launch.py
          crazyflies_yaml_file:=config/crazyflies.yaml
          server_yaml_file:=/root/platforms_ws/src/crazyswarm2/crazyflie/config/server.yaml
          urdf_file:=/root/platforms_ws/src/crazyswarm2/crazyflie/urdf/crazyflie_description.urdf
          mocap:=true
          mocap_config_file:=config/config_real.yaml
      - sleep 2; ros2 launch as2_platform_crazyswarm crazyswarm_swarm_launch.py
          swarm_config_file:=config/config_real.yaml
      <%- else %>
      - echo "Platform already launched in the first tmux session"
      - echo "Platform already launched in the first tmux session"
      <%- end %>

  # Basic Robotics Functions
  - basics_robotics_functions:
      layout:
      panes:
        # State Estimation
        - ros2 launch as2_state_estimator state_estimator_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config_real.yaml
        # Motion Controller
        - ros2 launch as2_motion_controller controller_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config_real.yaml
            plugin_name:=<%= motion_controller_plugin %>
            plugin_config_file:=config/<%= motion_controller_plugin %>.yaml


  # Behaviors
  - behaviors:
      layout:
      panes:
        # Motion Behaviors
        - ros2 launch as2_behaviors_motion motion_behaviors_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config_real.yaml
        # Auction Behavior
        - ros2 launch as2_auction_behavior auction_behavior_launch.py
            namespace:=<%= drone_namespace %>
            behavior_config_file:=config/config_real.yaml
        # Collision Avoidance Behavior
        - ros2 launch as2_behaviors_collision_avoidance collision_avoidance_behavior_launch.py
            namespace:=<%= drone_namespace %>
            use_sim_time:=false
            log_level:=info

  # Mission execution
  - mission_execution:
      layout:
      panes:
        - ros2 run as2_python_api mission_executor
                --n <%= drone_namespace %>
                --add_namespace
                --timer_freq 2.0 
        - ros2 run as2_python_api kb_monitor --drone_namespace <%= drone_namespace %> config/kb_monitor_config.json

  # Knowledge Base
  - knowledge_base:
      layout:
      panes:
        - ros2 launch knowledge_core knowledge_core.launch.py
            namespace:=<%= drone_namespace %>

        # CollectiveAwareness
        - ros2 launch as2_ca ca_gateway_launch.py 
            namespace:=<%= drone_namespace %>

  # Mission monitoring
  - mission_monitoring:
      layout: 
      panes:
        - ros2 run as2_alphanumeric_viewer as2_alphanumeric_viewer_node
            --ros-args -r  __ns:=/<%= drone_namespace %>
